<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sid Companion Extension</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      background-color: #FAF9F6;
      color: #151413;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 11px;
      color: #686660;
      line-height: 1.4;
      margin: 0 0 12px 0;
    }
    .status-box {
      background-color: #FFFFFF;
      border: 1px solid #E8E6DF;
      border-radius: 10px;
      padding: 10px;
      font-size: 11px;
    }
    .port {
      font-family: monospace;
      color: #96948D;
      font-size: 10px;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <h1>Sid Companion Bridge</h1>
  </div>
  <p>
    Active tab YouTube & YouTube Music playback metadata is securely transmitted to Sid Companion locally.
  </p>
  <div class="status-box">
    <strong>Local Bridge Receiver:</strong>
    <span class="port">http://127.0.0.1:49152</span>
  </div>
</body>
</html>
