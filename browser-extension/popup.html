<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      margin: 0;
      background: #080b18;
      color: #e2e8f0;
      font-family: sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    p { margin: 6px 0; color: #94a3b8; line-height: 1.4; font-size: 12px; }
    .badge {
      display: inline-block;
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 4px;
      color: #38bdf8;
      font-family: monospace;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <span>SID UNIVERSE BRIDGE</span>
  </div>
  <p>Automatically syncs your active YouTube & YouTube Music playback to Sid Companion.</p>
  <div class="badge">Target: 127.0.0.1:49152</div>
</body>
</html>
